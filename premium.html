<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium - SmartCover</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="policy.html" class="back-btn">←</a>
  
  <div class="app">
    <div class="header">
      <div class="header-icon">💳</div>
      <h1 class="header-title">Premium Details</h1>
      <p class="header-subtitle">Step 3/4 - Review & Confirm</p>
    </div>

    <div class="card">
      <h2 style="margin-bottom: 24px; text-align: center;">Payment Summary</h2>
      
      <div style="background: rgba(255,255,255,0.03); padding: 24px; border-radius: 16px; margin-bottom: 32px;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 16px;">
          <span>Zone Premium</span>
          <span id="zonePremium">₹0/wk</span>
        </div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 16px;">
          <span>Coverage Fee</span>
          <span>₹5/event</span>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 20px; font-weight: 600;">
          <span>Total Weekly</span>
          <strong id="totalPremium">₹0/wk</strong>
        </div>
      </div>

      <button onclick="confirmPremium()" class="btn btn-primary">
        ✅ Confirm → Claims Dashboard
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
